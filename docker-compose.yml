services:
  postgres:
    image: postgres:15.19-trixie
    container_name: MODUS-DB
    environment:
      POSTGRES_DB: trackerdb
      POSTGRES_USER: #add username

      POSTGRES_PASSWORD: #add password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      timeout: 5s

volumes:
    postgres-data:


